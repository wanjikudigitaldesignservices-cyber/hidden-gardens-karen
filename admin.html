<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hidden Gardens Events Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#FDF2F8;color:#334155}h1,h2{font-family:'Playfair Display',serif;font-weight:600}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14532d}.lb{background:white;padding:50px;border-radius:4px;max-width:400px;width:100%;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.1)}.lb h2{color:#166534;margin-bottom:24px;font-size:1.8rem}.lb input{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:4px;margin-bottom:15px;font-size:1rem;font-family:'Inter',sans-serif}.lb button{width:100%;padding:14px;background:#D4AF37;color:white;border:none;border-radius:4px;font-weight:500;cursor:pointer;font-size:1rem;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:1px;transition:0.3s}.lb button:hover{background:#166534}
.dash{display:none}.dh{background:#166534;color:white;padding:25px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}.dh h1{font-size:1.6rem}.dh button,.dh a{padding:10px 24px;border-radius:4px;border:1px solid #D4AF37;cursor:pointer;font-size:0.85rem;color:#D4AF37;background:transparent;text-decoration:none;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:1px;transition:0.3s}.dh button:hover,.dh a:hover{background:#D4AF37;color:white}.be{background:#D4AF37!important;color:white!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:40px}.sc{background:white;padding:30px;border-radius:4px;box-shadow:0 5px 20px rgba(22,101,52,0.05);border-bottom:3px solid #D4AF37}.sl{font-size:0.85rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;font-weight:500}.sv{font-size:2.8rem;font-family:'Playfair Display',serif;margin-top:10px;color:#166534}
.tw{padding:0 40px 40px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:white;border-radius:4px;overflow:hidden;box-shadow:0 5px 20px rgba(22,101,52,0.05)}th{background:#f8fafc;color:#166534;padding:20px;text-align:left;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #e2e8f0}td{padding:18px 20px;border-bottom:1px solid #f8fafc;font-size:0.95rem}
select.st{padding:8px 12px;border:1px solid #e2e8f0;border-radius:4px;font-family:'Inter',sans-serif;background:white;outline:none}.del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;font-weight:500}
@media(max-width:768px){.stats{grid-template-columns:1fr}}</style></head>
<body>
<div class="login" id="ls"><div class="lb"><h2>Hidden Gardens Admin</h2><input type="text" id="u" value="admin"><input type="password" id="p" placeholder="Password"><button onclick="login()">Access Events Portal</button></div></div>
<div class="dash" id="dash">
<div class="dh"><h1>Events Portal</h1><div><button class="be" onclick="exp()">Export</button> <a href="index.html">View Site</a> <button onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="sc"><div class="sl">Total Inquiries</div><div class="sv" id="st">0</div></div><div class="sc"><div class="sl">New</div><div class="sv" id="sn" style="color:#D4AF37">0</div></div><div class="sc"><div class="sl">Booked</div><div class="sv" id="sd" style="color:#10b981">0</div></div></div>
<div class="tw"><table><thead><tr><th>Date Rec'd</th><th>Client Name</th><th>Email / Phone</th><th>Event Type</th><th>Guests</th><th>Space</th><th>Event Date</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const K='hiddengardens_inquiries';if(sessionStorage.getItem('hg_admin')==='true')showD();
function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){sessionStorage.setItem('hg_admin','true');showD()}else alert('Invalid credentials')}
function logout(){sessionStorage.removeItem('hg_admin');location.reload()}
function showD(){document.getElementById('ls').style.display='none';document.getElementById('dash').style.display='block';render()}
function gd(){return JSON.parse(localStorage.getItem(K)||'[]').sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt))}
function sv(d){localStorage.setItem(K,JSON.stringify(d))}
function render(){const d=gd();document.getElementById('st').textContent=d.length;document.getElementById('sn').textContent=d.filter(x=>x.status==='New Inquiry').length;document.getElementById('sd').textContent=d.filter(x=>x.status==='Booked').length;
document.getElementById('tb').innerHTML=d.map(i=>`<tr><td>${new Date(i.submittedAt).toLocaleDateString('en-GB')}</td><td><strong>${i.name||'—'}</strong></td><td>${i.email}<br>${i.phone}</td><td>${i.event_type||'—'}</td><td>${i.guests||'—'}</td><td>${i.space||'—'}</td><td>${i.date||'—'}</td><td><select class="st" onchange="upd(${i.id},this.value)">${['New Inquiry','Contacted','Tour Scheduled','Booked','Archived'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="del" onclick="del(${i.id})">Del</button></td></tr>`).join('')}
function upd(id,s){const d=gd();const i=d.find(x=>x.id===id);if(i){i.status=s;sv(d);render()}}
function del(id){if(!confirm('Delete this inquiry?'))return;sv(gd().filter(x=>x.id!==id));render()}
function exp(){const d=gd();if(!d.length)return alert('No data');const h=['Received','Name','Phone','Email','Event Type','Guests','Space','Event Date','Inquiry Type','Status'];const r=d.map(i=>[new Date(i.submittedAt).toLocaleDateString(),i.name,i.phone,i.email,i.event_type,i.guests,i.space,i.date,i.inquiry_type,i.status]);const c=[h,...r].map(r=>r.map(c=>`"${(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hiddengardens_inquiries.csv';a.click()}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
